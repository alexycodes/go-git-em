version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - depguard
    - errorlint
    - misspell
    - nolintlint
    - unconvert
  settings:
    depguard:
      rules:
        # Only internal/gitcmd starts programs, so every git and ssh call gets
        # the same environment, process group and timeout handling.
        exec:
          files:
            - $all
            - "!$test"
            - "!**/internal/gitcmd/*.go"
          deny:
            - pkg: os/exec
              desc: only internal/gitcmd starts programs
    errcheck:
      exclude-functions:
        # Writes to the program's own stdout and stderr: nothing useful to do on failure.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    nolintlint:
      require-explanation: true
      require-specific: true

formatters:
  enable:
    - gofmt
    - goimports

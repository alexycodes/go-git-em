name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1" # weekly: new vulnerabilities and runner image changes
  workflow_call:

permissions:
  contents: read

concurrency:
  # The "ci-" prefix keeps this group apart from a calling workflow's own group.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0 # same as the devcontainer
      - name: go vet (windows)
        run: GOOS=windows go vet ./... # the test runners never build the !unix files
      - name: go mod tidy
        run: go mod tidy -diff
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Programs the tests need
        run: |
          command -v git ssh
          git --version
          ssh -V
          ls -l "$(git --exec-path)/git-http-backend"
      - name: go test
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
